<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洗牌翻牌效果</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Align items to the top */
            align-items: center;
            min-height: 100vh; /* Use min-height */
            padding: 20px;
            /* position: relative; No longer needed for container positioning */
            overflow: hidden; /* Hide overflowing elements during animation */
        }

        .card-stack-container {
            /* position: absolute; Removed */
            /* left: 50%; Removed */
            /* top: 35%; Removed */
            /* transform: translate(-50%, -50%); Removed */
            width: 300px; /* Increased width */
            height: calc(300px * 5 / 9); /* Calculate height based on width and new aspect ratio */
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
            margin-top: 50px; /* Add top margin for spacing */
            margin-bottom: 20px;
            position: relative; /* Needed for absolute positioning of cards inside */
        }

        .card-stack-container.moved-up {
            /* Adjust translateY for symmetry */
            transform: translateY(-80px); /* Move stack up - Reduced distance */
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            aspect-ratio: 9 / 5; /* Changed aspect ratio */
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: opacity 0.5s ease-in-out; /* Only transition opacity, transform handled by inner */
            /* transform-style moved to inner */
        }

        .card-inner {
            position: relative; /* Contain absolute children */
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease-in-out; /* Transition for flip */
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-back,
        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hide back during flip */
        }

        .card-back {
            background-image: url('../assets/card-back.png'); /* Default back */
            background-size: cover; /* Ensure image covers the area */
            background-position: center; /* Center the image */
            z-index: 1;
            transform: rotateY(0deg);
        }

        .card-front {
            background-image: url('../assets/card-front.jpg'); /* Default front */
            transform: rotateY(180deg);
            z-index: 0;
            /* Removed flex properties to allow absolute positioning from card.js */
            position: relative; /* Ensure it's a positioning context for absolute children */
            background-size: cover; /* Ensure background covers */
            background-position: center;
            background-repeat: no-repeat;
            box-sizing: border-box;
            background-color: white; /* Front background */
        }

        .card-front img {
            display: block; /* Remove extra space below image */
            width: 100%;
            height: 100%;
            object-fit: contain; /* Contain the image within bounds, no cropping */
            border-radius: inherit; /* Inherit border-radius from parent */
        }
        
        /* Removed specific .card-front img styles, handled by image-box in card.js */
        
        .card-front .title,
        .card-front .description {
            text-align: center;
            font-size: 0.8em;
            color: black;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg); /* Rotate the inner container */
        }
        /* Removed .card.revealed class */

        /* Styles for inner faces when flipped (redundant if parent rotates) */
        /* .card.flipped .card-back { transform: rotateY(180deg); } */
        /* .card.flipped .card-front { transform: rotateY(0deg); z-index: 2; } */


        .revealed-card-container {
            /* position: absolute; Removed */
            /* left: 50%; Removed */
            /* top: 55%; Removed */
            /* transform: translateX(-50%); Removed */
            width: 300px; /* Match stack width */
            min-height: calc(300px * 5 / 9 + 20px); /* Provide minimum height for revealed cards area */
            position: relative; /* Needed for absolute positioning of cards inside */
        }

        .controls {
            margin-bottom: 20px; /* Add margin below controls */
            /* margin-top: 20px; Removed */
            display: flex;
            gap: 10px;
            width: 100%; /* Make controls take full width */
            justify-content: center; /* Center buttons within controls */
            /* position: absolute; Removed */
            /* top: 0; Removed */
            /* left: 50%; Removed */
            /* transform: translateX(-50%); Removed */
            position: relative; /* Ensure z-index works */
            z-index: 10; /* Ensure controls are above cards */
        }

        .shuffle-button, .reset-button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .shuffle-button:hover, .reset-button:hover {
            background-color: #45a049;
        }
        
        /* Shuffle Animation Keyframes */
        @keyframes shuffle-up {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        @keyframes shuffle-down {
            0% { transform: translateY(0); }
            50% { transform: translateY(20px); }
            100% { transform: translateY(0); }
        }

        /* Fullscreen Overlay Styles */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .fullscreen-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <button id="shuffle-button" class="shuffle-button">洗牌</button>
            <button id="reset-button" class="reset-button">重置牌堆</button>
        </div>
        <div id="card-stack-container" class="card-stack-container">
            <!-- Card stack will be generated here -->
        </div>
        <div id="revealed-card-container" class="revealed-card-container">
            <!-- Revealed cards will be placed here -->
        </div>
    </div>

    <audio id="shuffle-sound" src="../assets/洗牌.mp3" preload="auto"></audio>

    <script src="../js/config.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/card.js"></script> <!-- Assuming Card class can be reused/adapted -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cardStackContainer = document.getElementById('card-stack-container');
            const revealedCardContainer = document.getElementById('revealed-card-container');
            const shuffleButton = document.getElementById('shuffle-button');
            const resetButton = document.getElementById('reset-button');
            const shuffleSound = document.getElementById('shuffle-sound');
            const cardCount = 10;
            let cardsData = [];
            let cardElements = [];
            let revealedCards = [];
            let isShuffling = false;
            let currentCardIndex = 0;

            // Adjust asset paths
            const originalConfig = CONFIG;
            CONFIG.assets = {
                cardBack: '../' + originalConfig.assets.cardBack.replace('./', ''),
                cardFront: '../' + originalConfig.assets.cardFront.replace('./', ''),
                dataFile: '../' + originalConfig.assets.dataFile.replace('./', '')
            };

            const dataLoader = new DataLoader(CONFIG.assets.dataFile);
            await dataLoader.loadData();

            function createCardElement(index, data) {
                const cardDiv = document.createElement('div');
                cardDiv.classList.add('card');
                cardDiv.dataset.index = index;
                // Initial transform removed, will be applied dynamically
                cardDiv.style.zIndex = cardCount - index; // Higher index cards are on top

                const cardInner = document.createElement('div'); // Create inner container
                cardInner.classList.add('card-inner');

                const cardBack = document.createElement('div');
                cardBack.classList.add('card-back');
                cardBack.style.backgroundImage = `url(${CONFIG.assets.cardBack})`;

                const cardFront = document.createElement('div');
                cardFront.classList.add('card-front');
                // Populate front with data
                if (data) {
                    const title = document.createElement('div');
                    title.classList.add('title');
                    title.textContent = data[0] || '';
                    
                    const img = document.createElement('img');
                    // Adjust image path relative to shuffle/index.html - MOVED TO revealCard
                    // const imagePath = data[3] ? '../' + data[3].replace('./', '') : CONFIG.assets.cardFront;
                    // img.src = imagePath; // Set in revealCard
                    img.alt = data[0] || 'Card Image'; // Set alt text

                    const description = document.createElement('div');
                    description.classList.add('description');
                    description.textContent = data[1] || '';

                    cardFront.appendChild(title);
                    cardFront.appendChild(img);
                    cardFront.appendChild(description);
                } else {
                     cardFront.style.backgroundImage = `url(${CONFIG.assets.cardFront})`; // Fallback
                }

                cardInner.appendChild(cardBack); // Append faces to inner container
                cardInner.appendChild(cardFront);
                cardDiv.appendChild(cardInner); // Append inner container to card
                return cardDiv;
            }

            function initializeCardStack() {
                cardStackContainer.innerHTML = '';
                revealedCardContainer.innerHTML = '';
                cardElements = [];
                revealedCards = [];
                currentCardIndex = 0;
                cardStackContainer.classList.remove('moved-up');

                // Get 10 random data entries
                cardsData = [];
                for (let k = 0; k < cardCount; k++) {
                    cardsData.push(dataLoader.getRandomDataGroup());
                }

                for (let i = 0; i < cardCount; i++) {
                    const cardElement = createCardElement(i, cardsData[i]);
                    cardStackContainer.appendChild(cardElement);
                    cardElements.push(cardElement);
                }
            }
            
            async function playShuffleSound() {
                try {
                    shuffleSound.currentTime = 0; // Rewind to start
                    await shuffleSound.play();
                } catch (error) {
                    console.error("Error playing shuffle sound:", error);
                }
            }

            async function shuffleAnimation() {
                if (isShuffling) return;
                isShuffling = true;
                shuffleButton.disabled = true;
                resetButton.disabled = true;
                cardStackContainer.removeEventListener('click', revealCard);

                const shufflePromises = [];

                for (let k = 0; k < 3; k++) { // Shuffle 3 times
                    playShuffleSound(); // Play sound concurrently
                    const animationPromises = [];
                    const cardsInStack = cardStackContainer.querySelectorAll('.card'); // Select only cards in the stack
                    for (let i = 0; i < cardsInStack.length; i++) {
                        const card = cardsInStack[i];
                        const animationName = i % 2 === 0 ? 'shuffle-up' : 'shuffle-down';
                        card.style.animation = `${animationName} 0.3s ease-in-out`;
                        animationPromises.push(new Promise(resolve => card.onanimationend = () => {
                            card.style.animation = ''; // Clear animation
                            resolve();
                        }));
                    }
                    await Promise.all(animationPromises);
                    await new Promise(resolve => setTimeout(resolve, 50)); // Short pause between shuffles
                }
                
                // Actual data shuffling (Fisher-Yates)
                for (let i = cardsData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
                }
                
                // Update card elements with new data (optional, could just use shuffled data index)
                // For simplicity, we'll just use the shuffled cardsData array when revealing
                console.log("Shuffling complete, data randomized.");

                isShuffling = false;
                shuffleButton.disabled = false;
                resetButton.disabled = false;
                cardStackContainer.addEventListener('click', revealCard);
            }

            function showFullscreenImage(imageUrl) {
                // Remove existing overlay if any
                const existingOverlay = document.getElementById('fullscreen-overlay');
                if (existingOverlay) {
                    existingOverlay.remove();
                }

                const overlay = document.createElement('div');
                overlay.id = 'fullscreen-overlay';
                overlay.classList.add('fullscreen-overlay');

                const img = document.createElement('img');
                img.src = imageUrl;
                img.classList.add('fullscreen-image');

                overlay.appendChild(img);
                overlay.addEventListener('click', () => {
                    overlay.remove();
                });

                document.body.appendChild(overlay);
            }

            function revealCard() {
                if (isShuffling || currentCardIndex >= cardCount) return;

                if (currentCardIndex === 0) {
                    // Move stack up on the first click
                    cardStackContainer.classList.add('moved-up');
                }

                const cardToReveal = cardElements[cardCount - 1 - currentCardIndex]; // Get top card from stack visual
                const cardData = cardsData[currentCardIndex]; // Get corresponding shuffled data
                
                // Update the card element's front face with correct data before flipping
                const frontFace = cardToReveal.querySelector('.card-front');
                const title = frontFace.querySelector('.title');
                const img = frontFace.querySelector('img');
                const description = frontFace.querySelector('.description');
                if(cardData) {
                    title.textContent = cardData[0] || '';
                    let finalImagePath = CONFIG.assets.cardFront; // Default fallback

                    if (cardData[3]) {
                        let csvPath = cardData[3].trim(); // Trim whitespace
                        // Check if it's likely just a filename (no slashes)
                        if (!csvPath.includes('/') && !csvPath.includes('\\')) {
                            // Assume it belongs in the assets directory relative to root
                            finalImagePath = '../assets/' + csvPath;
                        } else {
                            // Assume it's a path relative to root (e.g., assets/img.png or ./assets/img.png)
                            // Remove leading ./ if present
                            let relativePath = csvPath.replace(/^\.\//, '');
                            finalImagePath = '../' + relativePath;
                        }
                    }

                    console.log(`Card ${currentCardIndex}: Setting image src to: ${finalImagePath} (from CSV: ${cardData[3]})`); // Log details
                    img.src = finalImagePath;
                    img.alt = cardData[0] || 'Card Image';
                    description.textContent = cardData[1] || '';
                } else {
                     // Fallback if no cardData (shouldn't happen with current logic)
                     title.textContent = '';
                     console.log("Setting image src to fallback:", CONFIG.assets.cardFront); // Add logging
                     img.src = CONFIG.assets.cardFront;
                     img.alt = 'Card Image';
                     description.textContent = '';
                }

                // Set z-index for stacking
                cardToReveal.style.zIndex = revealedCards.length + 1;

                // Set the final translate position for vertical stacking
                // Apply vertical offset using transform: translateY
                cardToReveal.style.transform = `translateY(${revealedCards.length * 20}px)`; // Use translateY for stacking
                cardToReveal.style.top = ''; // Clear any explicit top positioning
                // Optionally, add a slight horizontal offset for a fanned effect if desired:
                // cardToReveal.style.transform = `translate(${revealedCards.length * 1}px, ${revealedCards.length * 20}px)`;

                // Move card to revealed container
                revealedCardContainer.appendChild(cardToReveal);

                // Add flipped class to trigger the animation *after* moving
                // Use a slight delay to ensure the element is rendered before applying the class
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => { // Double requestAnimationFrame for broader compatibility
                         cardToReveal.classList.add('flipped');
                    });
                });
                
                revealedCards.push(cardToReveal);
                currentCardIndex++;

                // Add click listener for fullscreen view AFTER it's revealed
                cardToReveal.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent container reset click
                    const frontImg = cardToReveal.querySelector('.card-front img');
                    if (frontImg && frontImg.src) {
                        showFullscreenImage(frontImg.src);
                    }
                });
                
                // Hide the original placeholder in the stack if needed (or just let it be covered)
                // cardStackContainer.children[cardCount - 1 - currentCardIndex].style.opacity = 0; // Example
            }

            function resetCards() {
                if (isShuffling) return;
                console.log("Resetting cards...");
                // Remove fullscreen overlay if present
                const existingOverlay = document.getElementById('fullscreen-overlay');
                if (existingOverlay) {
                    existingOverlay.remove();
                }
                revealedCardContainer.innerHTML = ''; // Clear revealed cards
                initializeCardStack(); // Re-create the initial stack
                cardStackContainer.addEventListener('click', revealCard);
            }

            // Event Listeners
            shuffleButton.addEventListener('click', shuffleAnimation);
            resetButton.addEventListener('click', resetCards);
            cardStackContainer.addEventListener('click', revealCard);

            // Initial setup
            initializeCardStack();
            revealedCardContainer.addEventListener('click', (event) => {
                // Only reset if the click is directly on the container itself,
                // not on a card within it.
                if (event.target === revealedCardContainer) {
                    console.log('Revealed container background clicked. Attempting reset...');
                    resetCards();
                } else {
                    console.log('Revealed container clicked, but target was a child (likely a card). No reset.');
                }
            });
        });
    </script>
    <script src="../js/verification.js"></script>
    <script>
        // Ensure CONFIG is loaded and then run verification check
        document.addEventListener('DOMContentLoaded', () => {
            // Check if CONFIG is defined before proceeding
            if (typeof CONFIG !== 'undefined') {
                checkVerification();
            } else {
                console.error('CONFIG object not found. Verification cannot proceed.');
            }
        });
    </script>
</body>
</html>
